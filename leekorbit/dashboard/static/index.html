<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>LeekOrbit 韭菜观察站</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root { --bg:#0f1115; --card:#181b22; --fg:#d7dae0; --dim:#8a90a0; --up:#e05555; --down:#3fa66a; --acc:#e0a458; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:16px 24px; display:flex; gap:32px; align-items:baseline; border-bottom:1px solid #262a33; }
  header h1 { font-size:18px; margin:0; color:var(--acc); }
  .stat b { font-size:20px; }
  main { display:grid; grid-template-columns: 1.2fr 1fr; gap:16px; padding:16px 24px; }
  .card { background:var(--card); border-radius:10px; padding:14px 16px; }
  .card h2 { font-size:14px; color:var(--dim); margin:0 0 10px; font-weight:600; }
  table { width:100%; border-collapse:collapse; }
  td,th { padding:4px 6px; text-align:right; font-variant-numeric:tabular-nums; }
  td:first-child, th:first-child { text-align:left; }
  .up { color:var(--up); } .down { color:var(--down); } .dim { color:var(--dim); }
  #timeline { max-height:420px; overflow-y:auto; }
  .wake { padding:6px 8px; border-left:3px solid #333; margin:4px 0; cursor:pointer; border-radius:0 6px 6px 0; }
  .wake:hover { background:#20242e; }
  .wake.trade { border-left-color:var(--up); }
  .wake.action { border-left-color:var(--acc); }
  .wake.skipped, .wake.failed { opacity:.45; cursor:default; }
  #diary .entry { border-bottom:1px dashed #2a2f3a; padding:6px 0; }
  #detail { position:fixed; inset:5% 8%; background:#141821; border:1px solid #333; border-radius:12px;
            padding:20px; overflow-y:auto; display:none; z-index:9; white-space:pre-wrap; }
  #detail .close { float:right; cursor:pointer; color:var(--dim); font-size:18px; }
  #detail h3 { color:var(--acc); margin:12px 0 4px; font-size:13px; }
  .msg { margin:6px 0; padding:6px 10px; border-radius:8px; background:#1c212b; }
  .msg.assistant { background:#232936; }
  .msg .role { color:var(--dim); font-size:12px; }
  canvas { max-height:260px; }
  .full { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>🌱 LeekOrbit 韭菜观察站</h1>
  <span class="stat">总资产 <b id="total">–</b></span>
  <span class="stat dim">现金 <span id="cash">–</span></span>
  <span class="stat dim">持仓市值 <span id="mv">–</span></span>
  <span class="stat dim" id="agent"></span>
</header>
<main>
  <div class="card"><h2>净值曲线（vs 沪深300，同起点归一）</h2><canvas id="navChart"></canvas></div>
  <div class="card"><h2>当前持仓</h2>
    <table id="positions"><thead><tr><th>股票</th><th>数量</th><th>成本</th><th>现价</th><th>浮动盈亏</th></tr></thead><tbody></tbody></table>
  </div>
  <div class="card"><h2>决策时间线（点击查看完整快照）</h2><div id="timeline"></div></div>
  <div class="card"><h2>韭菜日记</h2><div id="diary" style="max-height:420px;overflow-y:auto"></div></div>
  <div class="card full"><h2>LLM 成本（元/日）</h2><table id="costs"><thead>
    <tr><th>日期</th><th>调用</th><th>输入token</th><th>输出token</th><th>成本</th></tr></thead><tbody></tbody></table></div>
</main>
<div id="detail"></div>
<script>
const $ = s => document.querySelector(s);
const fmt = n => n == null ? '–' : n.toLocaleString('zh-CN', {maximumFractionDigits: 2});
const cls = n => n > 0 ? 'up' : n < 0 ? 'down' : '';

async function j(url) { const r = await fetch(url); return r.json(); }

async function loadSummary() {
  const s = await j('/api/summary');
  $('#total').textContent = fmt(s.total); $('#cash').textContent = fmt(s.cash);
  $('#mv').textContent = fmt(s.market_value); $('#agent').textContent = s.agent;
  $('#positions tbody').innerHTML = s.positions.map(p => `<tr>
    <td>${p.name || ''} ${p.symbol}</td><td>${p.qty}</td><td>${fmt(p.avg_cost)}</td>
    <td class="${cls(p.pct)}">${fmt(p.last)} ${p.pct == null ? '' : '(' + p.pct + '%)'}</td>
    <td class="${cls(p.pnl)}">${fmt(p.pnl)} ${p.pnl_pct == null ? '' : '(' + p.pnl_pct + '%)'}</td>
  </tr>`).join('') || '<tr><td class="dim">空仓</td></tr>';
}

let chart;
async function loadNav() {
  const rows = await j('/api/nav');
  if (!rows.length) return;
  const base = rows[0].nav, bbase = rows.find(r => r.benchmark)?.benchmark;
  chart?.destroy();
  chart = new Chart($('#navChart'), { type: 'line', data: {
    labels: rows.map(r => r.date),
    datasets: [
      { label: '韭菜净值', data: rows.map(r => r.nav / base), borderColor: '#e0a458', tension: .2 },
      { label: '沪深300', data: rows.map(r => r.benchmark && bbase ? r.benchmark / bbase : null),
        borderColor: '#5a7dcf', borderDash: [5, 4], tension: .2 },
    ]}, options: { plugins: { legend: { labels: { color: '#d7dae0' } } },
      scales: { x: { ticks: { color: '#8a90a0' } }, y: { ticks: { color: '#8a90a0' } } } } });
}

const SCENE = { premarket: '盘前', intraday: '盘中', lunch: '午休', close_review: '收盘',
                evening: '晚间', weekend: '周末' };
async function loadTimeline() {
  const rows = await j('/api/wakes');
  $('#timeline').innerHTML = rows.map(w => {
    const d = w.detail || '';
    const kind = /[1-9]\d* trades/.test(d) ? 'trade' : /[1-9]\d* actions/.test(d) ? 'action' : w.status;
    return `<div class="wake ${kind}" ${w.snapshot_id ? `onclick="showSnap(${w.snapshot_id})"` : ''}>
      <span class="dim">${w.ts.slice(5, 16)}</span> ${SCENE[w.scene] || w.scene}
      <span class="dim">${w.status === 'done' ? d : w.status}</span></div>`;
  }).join('');
}

async function showSnap(id) {
  const s = await j('/api/snapshot/' + id);
  const msgs = s.transcript.map(ph => `<h3>—— ${ph.tier === 'cheap' ? '看盘脑' : '决策脑'} ——</h3>` +
    ph.messages.filter(m => m.role !== 'system').map(m => {
      const calls = (m.tool_calls || []).map(c => `<div class="dim">→ ${c.function.name}(${c.function.arguments})</div>`).join('');
      return `<div class="msg ${m.role}"><span class="role">${m.role}</span><br>${(m.content || '')}${calls}</div>`;
    }).join('')).join('');
  const acts = s.actions.map(a => `<div>• ${a.tool}(${JSON.stringify(a.args)}) → ${a.result}</div>`).join('');
  $('#detail').innerHTML = `<span class="close" onclick="this.parentNode.style.display='none'">✕ 关闭</span>
    <h3>快照 #${s.id} ${s.ts} ${SCENE[s.scene] || s.scene}  <span class="dim">${JSON.stringify(s.cost)}</span></h3>
    <h3>它看到的手机屏幕</h3><div class="msg">${s.feed}</div>
    <h3>它的想法与操作</h3>${msgs}<h3>动作与结果</h3>${acts || '<span class="dim">无</span>'}`;
  $('#detail').style.display = 'block';
}

async function loadDiary() {
  const rows = await j('/api/diary');
  $('#diary').innerHTML = rows.map(e =>
    `<div class="entry"><span class="dim">${e.ts.slice(0, 16)} ${SCENE[e.scene] || ''}</span><br>${e.content}</div>`
  ).join('') || '<span class="dim">还没写过日记</span>';
}

async function loadCosts() {
  const rows = await j('/api/costs');
  $('#costs tbody').innerHTML = rows.map(r =>
    `<tr><td>${r.date}</td><td>${r.calls}</td><td>${fmt(r.pt)}</td><td>${fmt(r.ct)}</td><td>¥${r.cost_cny}</td></tr>`
  ).join('');
}

function refresh() { loadSummary(); loadNav(); loadTimeline(); loadDiary(); loadCosts(); }
refresh(); setInterval(refresh, 60_000);
</script>
</body>
</html>
